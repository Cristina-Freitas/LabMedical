<h1 class="paciente-title">{{ title }}</h1>
<div class="input-group">
    <label for="pesquisarPaciente" class="pesquisaLabel"></label>
    <input
      [(ngModel)]="pesquisarPaciente"
      (keyup.enter)="pesquisar()"
      id="pesquisarPaciente"
      name="pesquisarPaciente"
      type="text"
      aria-label="Buscar paciente"
      placeholder="Nome, telefone, e-mail ou registro"
    />
    <button class="botoes-formulario" type="button" (click)="pesquisar()">
      Buscar
    </button>
</div>
