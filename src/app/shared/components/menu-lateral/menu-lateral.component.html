<aside class="sidebar" [class.recolhido]="recolhido" aria-label="Menu principal">
  <div class="img-menu">
    <img src="assets/images/labMedical-menu-img.png" alt="LABMedical" />
  </div>

  <nav class="sidebar-nav">
    @for (grupo of grupos; track grupo.titulo) {
    <div class="grupo">
      <h2>{{ grupo.titulo }}</h2>
      @for (item of grupo.itens; track item.rota) {
      <button type="button" class="item"
              [class.ativo]="estaAtivo(item.rota)"
              [attr.aria-current]="estaAtivo(item.rota) ? 'page' : null"
              (click)="ir(item.rota)"
              [title]="recolhido ? item.rotulo : ''"
              [attr.aria-label]="item.rotulo">
        <i class="pi" [ngClass]="item.icone" aria-hidden="true"></i>
        <span class="rotulo">{{ item.rotulo }}</span>
      </button>
      }
    </div>
    }

    <div class="grupo grupo-sair">
      <button type="button" class="item" (click)="sair()"
              [title]="recolhido ? 'Sair' : ''" aria-label="Sair">
        <i class="pi pi-sign-out" aria-hidden="true"></i>
        <span class="rotulo">Sair</span>
      </button>
    </div>
  </nav>

  <button type="button" class="alternar" (click)="alternar()"
          [attr.aria-expanded]="!recolhido"
          [attr.aria-label]="recolhido ? 'Estender menu' : 'Recolher menu'"
          [title]="recolhido ? 'Estender menu' : 'Recolher menu'">
    <i class="pi" [ngClass]="recolhido ? 'pi-angle-double-right' : 'pi-angle-double-left'" aria-hidden="true"></i>
    <span class="rotulo">Recolher</span>
  </button>
</aside>
