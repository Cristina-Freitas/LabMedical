<ul>
 <li *ngFor="let paciente of pacientes">
  <div>
   <div class="color"></div>
   <div class="circle"><mat-icon>person</mat-icon></div>
   <p class="nome">{{ paciente.nomePaciente }}</p>
   <p class="idade">{{ calcularIdade(paciente.datanascimento) }} anos</p>
   <p class="telefone">{{ paciente.telefonePaciente | mask: '(00) 0 0000-0000' }}</p>
   <p class="convenio" [class.sem-convenio]="!paciente.convenio">
     {{ paciente.convenio || 'Sem Convênio' }}
   </p>
   <span class="ver-mais" role="button" tabindex="0"
         (click)="verMais(paciente)" (keyup.enter)="verMais(paciente)">Ver mais</span>
  </div>
 </li>
</ul>
<p *ngIf="pacientes.length === 0" class="nome">Nenhum paciente para exibir.</p>
