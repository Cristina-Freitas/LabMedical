<app-menu-lateral></app-menu-lateral>
<app-toolbar></app-toolbar>
<app-footer></app-footer>
<app-busca title="Utilize a barra de pesquisa para buscar" (resultadoBusca)="receberResultadoBusca($event)"></app-busca>
<div class="lista-container">

    <p-table [value]="pacientesExibidos" [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template pTemplate="header">
            <tr>
                <th>Registro</th>
                <th>Nome do Paciente</th>
                <th>Convênio</th>
                <th></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-paciente> 
            <tr (click)="clicarPaciente(paciente)" class="destaque">
                <td>{{ paciente.id }}</td>
                <td>{{ paciente.nomePaciente }}</td>
                <td>{{ paciente.convenio || 'Sem Convênio' }}</td>
                <td class="pacientListArrow"><i class="pi pi-chevron-right"></i></td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr><td colspan="4">Nenhum paciente encontrado.</td></tr>
        </ng-template>
    </p-table>
  

  </div>
